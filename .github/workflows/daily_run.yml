name: Daily Motivated Seller Pipeline

on:
  schedule:
    # 6:00 AM EST / 7:00 AM EDT, Monday-Friday. This leaves a buffer before 8 AM ET.
    - cron: '0 11 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore SQLite DB cache
        uses: actions/cache@v4
        with:
          path: data/leads.db
          key: leads-db-v2-${{ github.run_id }}
          restore-keys: |
            leads-db-v2-

      - name: Ensure data directory exists
        run: mkdir -p data

      - name: Write Google credentials
        run: printf '%s' '${{ secrets.GOOGLE_CREDENTIALS_JSON }}' > /tmp/goog_creds.json

      - name: Init DB
        run: python main.py init-db
        env:
          DATABASE_URL: sqlite:///data/leads.db

      - name: Run all active adapters
        run: python main.py run
        env:
          DATABASE_URL: sqlite:///data/leads.db
          GOOGLE_CREDENTIALS_JSON: /tmp/goog_creds.json

      - name: Push to Google Sheet
        run: python main.py push-sheet
        env:
          DATABASE_URL: sqlite:///data/leads.db
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_CREDENTIALS_JSON: /tmp/goog_creds.json

      - name: Save SQLite DB cache
        if: always()
        uses: actions/cache@v4
        with:
          path: data/leads.db
          key: leads-db-v2-${{ github.run_id }}

      - name: Preserve operational run summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-run-${{ github.run_id }}
          path: data/run_summary.json
          if-no-files-found: warn
          retention-days: 30
